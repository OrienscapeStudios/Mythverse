name: Discord Commit Notification

on:
  push:
    branches:
      - '**'  # Trigger di semua branch

jobs:
  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history, perlu buat range commit

      - name: Get commit info
        id: commit_info
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_SHA}"
          BEFORE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          # Deteksi push pertama / branch baru / force-push tak valid
          if [[ "$BEFORE_SHA" == "$ZERO_SHA" ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE_LOG="-1 $COMMIT_SHA"
            COMPARE_URL="${REPO_URL}/commits/${COMMIT_SHA}"
            IS_FRESH=true
          else
            RANGE_LOG="${BEFORE_SHA}..${COMMIT_SHA}"
            COMPARE_URL="${REPO_URL}/compare/${BEFORE_SHA}...${COMMIT_SHA}"
            IS_FRESH=false
          fi

          # Total commit dalam range
          if [[ "$IS_FRESH" == true ]]; then
            TOTAL_COMMITS=$(git rev-list --count -1 "$COMMIT_SHA" 2>/dev/null || echo 1)
          else
            TOTAL_COMMITS=$(git rev-list --count "$RANGE_LOG" 2>/dev/null || echo 1)
          fi

          # Files changed dalam range
          if [[ "$IS_FRESH" == true ]]; then
            if git cat-file -e "${COMMIT_SHA}~1" 2>/dev/null; then
              FILES_CHANGED=$(git diff --name-only "${COMMIT_SHA}~1" "$COMMIT_SHA" 2>/dev/null | wc -l)
            else
              FILES_CHANGED=$(git show --name-only --pretty=format: "$COMMIT_SHA" 2>/dev/null | grep -c .)
            fi
          else
            FILES_CHANGED=$(git diff --name-only "$RANGE_LOG" 2>/dev/null | wc -l || echo 0)
          fi

          if [[ "$BRANCH" == "master" ]]; then
            COLOR=5763719
          elif [[ "$BRANCH" == "dev" ]]; then
            COLOR=3447003
          elif [[ "$BRANCH" == release/* ]]; then
            COLOR=15105570
          elif [[ "$BRANCH" == hotfix/* ]]; then
            COLOR=15548997
          else
            COLOR=10070709
          fi

          {
            echo "commit_short=$COMMIT_SHORT"
            echo "branch=$BRANCH"
            echo "repo_name=$REPO_NAME"
            echo "commit_url=$COMMIT_URL"
            echo "compare_url=$COMPARE_URL"
            echo "color=$COLOR"
            echo "total_commits=$TOTAL_COMMITS"
            echo "files_changed=$FILES_CHANGED"
            echo "range_log=$RANGE_LOG"
            echo "is_fresh=$IS_FRESH"
          } >> $GITHUB_OUTPUT

      - name: Send Discord Notification (batched)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          REPO_NAME: ${{ steps.commit_info.outputs.repo_name }}
          COMMIT_URL: ${{ steps.commit_info.outputs.commit_url }}
          COLOR: ${{ steps.commit_info.outputs.color }}
          BRANCH: ${{ steps.commit_info.outputs.branch }}
          TOTAL_COMMITS: ${{ steps.commit_info.outputs.total_commits }}
          FILES_CHANGED: ${{ steps.commit_info.outputs.files_changed }}
          PUSHED_BY: ${{ github.actor }}
          COMPARE_URL: ${{ steps.commit_info.outputs.compare_url }}
          REPO_FULL: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          ORG_AVATAR: https://github.com/${{ github.repository_owner }}.png
          RANGE_LOG: ${{ steps.commit_info.outputs.range_log }}
          IS_FRESH: ${{ steps.commit_info.outputs.is_fresh }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          MENTION="<@&$ROLE_ID>"
          CHUNK_SIZE=10

          # Truncate subject: max 40 char, potong di batas kata,
          # lalu tempel "..." + kata terakhir dari subject asli
          truncate_subject() {
            local subject="$1"
            local limit=40

            if [[ ${#subject} -le $limit ]]; then
              echo "$subject"
              return
            fi

            local cut="${subject:0:$limit}"
            local trimmed="${cut% *}"
            if [[ "$trimmed" == "$cut" && "$cut" != *" "* ]]; then
              trimmed="$cut"
            fi

            local last_word="${subject##* }"
            echo "${trimmed}...${last_word}"
          }

          # Ambil semua commit dalam range, urutan lama -> baru
          if [[ "$IS_FRESH" == "true" ]]; then
            mapfile -t ALL_HASHES < <(git log --reverse --pretty=format:"%H" -1 "$COMMIT_SHA" 2>/dev/null)
            mapfile -t ALL_SUBJECTS < <(git log --reverse --pretty=format:"%s" -1 "$COMMIT_SHA" 2>/dev/null)
          else
            mapfile -t ALL_HASHES < <(git log --reverse --pretty=format:"%H" $RANGE_LOG 2>/dev/null)
            mapfile -t ALL_SUBJECTS < <(git log --reverse --pretty=format:"%s" $RANGE_LOG 2>/dev/null)
          fi

          ACTUAL_TOTAL=${#ALL_HASHES[@]}
          if [[ $ACTUAL_TOTAL -eq 0 ]]; then
            ACTUAL_TOTAL=1
          fi

          TOTAL_CHUNKS=$(( (ACTUAL_TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ))
          if [[ $TOTAL_CHUNKS -lt 1 ]]; then
            TOTAL_CHUNKS=1
          fi

          for (( batch=0; batch<TOTAL_CHUNKS; batch++ )); do
            START=$(( batch * CHUNK_SIZE ))
            BATCH_NUM=$(( batch + 1 ))

            BATCH_LIST=""
            for (( i=START; i<START+CHUNK_SIZE && i<ACTUAL_TOTAL; i++ )); do
              HASH="${ALL_HASHES[$i]}"
              SHORT="${HASH:0:7}"
              SUBJ=$(truncate_subject "${ALL_SUBJECTS[$i]}")
              LINE="[\`${SHORT}\`](${REPO_URL}/commit/${HASH}) ${SUBJ}"
              BATCH_LIST="${BATCH_LIST}${LINE}"$'\n'
            done

            if [[ -z "$BATCH_LIST" ]]; then
              BATCH_LIST="No commit details available."
            fi

            # Title: tambahkan (Part X/Y) hanya kalau lebih dari 1 batch
            if [[ $TOTAL_CHUNKS -gt 1 ]]; then
              TITLE="${REPO_NAME} (Part ${BATCH_NUM}/${TOTAL_CHUNKS})"
            else
              TITLE="$REPO_NAME"
            fi

            # Mention role hanya di notif pertama, biar gak spam ping tiap batch
            if [[ $batch -eq 0 ]]; then
              CONTENT="$MENTION"
            else
              CONTENT=""
            fi

            PAYLOAD=$(jq -n \
              --arg content "$CONTENT" \
              --arg title "$TITLE" \
              --arg commit_url "$COMMIT_URL" \
              --arg color "$COLOR" \
              --arg commit_list "$BATCH_LIST" \
              --arg branch "\`$BRANCH\`" \
              --arg total_commits "\`$TOTAL_COMMITS commit(s)\`" \
              --arg files_changed "\`$FILES_CHANGED file(s)\`" \
              --arg pushed_by "$PUSHED_BY" \
              --arg compare "[View Diff]($COMPARE_URL)" \
              --arg footer "GitHub Actions • $REPO_FULL" \
              --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg avatar_url "$ORG_AVATAR" \
              '{
                "username": "Orienscape Studios",
                "avatar_url": $avatar_url,
                "content": $content,
                "embeds": [{
                  "title": $title,
                  "url": $commit_url,
                  "color": ($color | tonumber),
                  "description": $commit_list,
                  "fields": [
                    { "name": "🌿 Branch", "value": $branch, "inline": true },
                    { "name": "📝 Commits", "value": $total_commits, "inline": true },
                    { "name": "📁 Files Changed", "value": $files_changed, "inline": true },
                    { "name": "🚀 Pushed by", "value": $pushed_by, "inline": true },
                    { "name": "🔗 Compare", "value": $compare, "inline": true }
                  ],
                  "footer": { "text": $footer },
                  "timestamp": $timestamp
                }]
              }')

            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

            # Jeda kecil antar batch biar aman dari rate limit Discord webhook
            if [[ $BATCH_NUM -lt $TOTAL_CHUNKS ]]; then
              sleep 1
            fi
          done