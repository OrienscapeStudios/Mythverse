name: Discord Commit Notification

on:
  push:
    branches:
      - '**'  # Trigger di semua branch

jobs:
  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, perlu buat range commit

      - name: Get commit info
        id: commit_info
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_SHA}"
          BEFORE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          # Deteksi push pertama / branch baru / force-push tak valid
          if [[ "$BEFORE_SHA" == "$ZERO_SHA" ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE_LOG="-1 $COMMIT_SHA"
            COMPARE_URL="${REPO_URL}/commits/${COMMIT_SHA}"
            IS_FRESH=true
          else
            RANGE_LOG="${BEFORE_SHA}..${COMMIT_SHA}"
            COMPARE_URL="${REPO_URL}/compare/${BEFORE_SHA}...${COMMIT_SHA}"
            IS_FRESH=false
          fi

          # Total commit dalam range
          if [[ "$IS_FRESH" == true ]]; then
            TOTAL_COMMITS=1
          else
            TOTAL_COMMITS=$(git rev-list --count "$RANGE_LOG" 2>/dev/null || echo 1)
          fi

          # Files changed dalam range
          if [[ "$IS_FRESH" == true ]]; then
            FILES_CHANGED=$(git diff --name-only "${COMMIT_SHA}~1" "$COMMIT_SHA" 2>/dev/null | wc -l || echo 1)
          else
            FILES_CHANGED=$(git diff --name-only "$RANGE_LOG" 2>/dev/null | wc -l || echo 0)
          fi

          # Build list commit (subject line only, per commit, max 10 baris)
          MAX_LINES=10
          COMMIT_LIST=""
          LINE_COUNT=0

          while IFS=$'\x1f' read -r c_hash c_subject c_author; do
            [[ -z "$c_hash" ]] && continue
            LINE_COUNT=$((LINE_COUNT + 1))
            if [[ $LINE_COUNT -le $MAX_LINES ]]; then
              SHORT="${c_hash:0:7}"
              LINE="[\`${SHORT}\`](${REPO_URL}/commit/${c_hash}) ${c_subject} — ${c_author}"
              COMMIT_LIST="${COMMIT_LIST}${LINE}"$'\n'
            fi
          done < <(git log --pretty=format:"%H%x1f%s%x1f%an" $RANGE_LOG 2>/dev/null)

          if [[ $TOTAL_COMMITS -gt $MAX_LINES ]]; then
            REMAINING=$((TOTAL_COMMITS - MAX_LINES))
            COMMIT_LIST="${COMMIT_LIST}"$'\n'"_...and ${REMAINING} more commit(s)_"
          fi

          # Fallback kalau list kosong (safety net)
          if [[ -z "$COMMIT_LIST" ]]; then
            COMMIT_LIST="No commit details available."
          fi

          if [[ "$BRANCH" == "master" ]]; then
            COLOR=5763719
          elif [[ "$BRANCH" == "dev" ]]; then
            COLOR=3447003
          elif [[ "$BRANCH" == release/* ]]; then
            COLOR=15105570
          elif [[ "$BRANCH" == hotfix/* ]]; then
            COLOR=15548997
          else
            COLOR=10070709
          fi

          {
            echo "commit_short=$COMMIT_SHORT"
            echo "branch=$BRANCH"
            echo "repo_name=$REPO_NAME"
            echo "commit_url=$COMMIT_URL"
            echo "compare_url=$COMPARE_URL"
            echo "color=$COLOR"
            echo "total_commits=$TOTAL_COMMITS"
            echo "files_changed=$FILES_CHANGED"
          } >> $GITHUB_OUTPUT

          # Multi-line output butuh delimiter khusus
          {
            echo "commit_list<<COMMITLIST_EOF"
            echo "$COMMIT_LIST"
            echo "COMMITLIST_EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: |
          MENTION="<@&$ROLE_ID>"

          PAYLOAD=$(jq -n \
            --arg mention "$MENTION" \
            --arg repo_name "${{ steps.commit_info.outputs.repo_name }}" \
            --arg commit_url "${{ steps.commit_info.outputs.commit_url }}" \
            --arg color "${{ steps.commit_info.outputs.color }}" \
            --arg commit_list "${{ steps.commit_info.outputs.commit_list }}" \
            --arg branch "\`${{ steps.commit_info.outputs.branch }}\`" \
            --arg total_commits "\`${{ steps.commit_info.outputs.total_commits }} commit(s)\`" \
            --arg files_changed "\`${{ steps.commit_info.outputs.files_changed }} file(s)\`" \
            --arg pushed_by "${{ github.actor }}" \
            --arg compare "[View Diff](${{ steps.commit_info.outputs.compare_url }})" \
            --arg footer "GitHub Actions • ${{ github.repository }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              "username": "GitHub Notifier",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "content": $mention,
              "embeds": [{
                "title": $repo_name,
                "url": $commit_url,
                "color": ($color | tonumber),
                "description": $commit_list,
                "fields": [
                  { "name": "🌿 Branch", "value": $branch, "inline": true },
                  { "name": "📝 Commits", "value": $total_commits, "inline": true },
                  { "name": "📁 Files Changed", "value": $files_changed, "inline": true },
                  { "name": "🚀 Pushed by", "value": $pushed_by, "inline": true },
                  { "name": "🔗 Compare", "value": $compare, "inline": true }
                ],
                "footer": { "text": $footer },
                "timestamp": $timestamp
              }]
            }')

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"