name: Automated Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Tag Name
        id: get_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="build-$(date +'%Y%m%d%H%M%S')"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "ZIP_NAME=Release-Asset-${TAG}.zip" >> $GITHUB_ENV

      - name: Package Directory with Exclusions
        run: |
          # 1. Tentukan folder dan ekstensi yang ingin dikecualikan
          EXCLUDES=(
            # Internal & Git
            "*.git*"
            "*.github*"
            "*.gitignore"
            
            # File system & Editor
            ".vscode/*"
            ".idea/*"
            "Thumbs.db"
            ".DS_Store"

            # Folder kerja / source mentah
            "Raw Assets/*"
            "Temp/*"
            "Logs/*"

            # Ekstensi file mentah & sementara
            "*.psd"
            "*.blend1"
            "*.tmp"
            "*.log"
            "*.bak"
          )

          # 2. Susun flag -x untuk setiap item
          EXCLUDE_FLAGS=()
          for item in "${EXCLUDES[@]}"; do
            EXCLUDE_FLAGS+=(-x "$item")
          done

          # 3. Eksekusi kompresi
          zip -r "$ZIP_NAME" . "${EXCLUDE_FLAGS[@]}"

      - name: Generate SHA256 Checksum
        run: |
          sha256sum "$ZIP_NAME" > checksum.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Send Discord Release Notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
          RELEASED_BY: ${{ github.actor }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}
          ORG_AVATAR: https://github.com/${{ github.repository_owner }}.png
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL is not set. Skipping Discord notification."
            exit 0
          fi

          if [ -n "$ROLE_ID" ]; then
            CONTENT="<@&$ROLE_ID>"
          else
            CONTENT=""
          fi

          ASSET_SIZE=$(ls -lh "$ZIP_NAME" 2>/dev/null | awk '{print $5}' || echo "N/A")
          CHECKSUM=$(awk '{print $1}' checksum.txt 2>/dev/null || echo "N/A")
          TITLE="📦 New Release: ${REPO_NAME} ${TAG_NAME}"
          COLOR=5763719

          PAYLOAD=$(jq -n \
            --arg content "$CONTENT" \
            --arg title "$TITLE" \
            --arg release_url "$RELEASE_URL" \
            --arg color "$COLOR" \
            --arg tag "\`$TAG_NAME\`" \
            --arg asset "\`$ZIP_NAME\` (${ASSET_SIZE})" \
            --arg checksum "\`${CHECKSUM:0:16}...\`" \
            --arg released_by "$RELEASED_BY" \
            --arg view_release "[View Release & Assets]($RELEASE_URL)" \
            --arg footer "GitHub Actions • $REPO_FULL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg avatar_url "$ORG_AVATAR" \
            '{
              "username": "Orienscape Studios",
              "avatar_url": $avatar_url,
              "content": $content,
              "embeds": [{
                "title": $title,
                "url": $release_url,
                "color": ($color | tonumber),
                "description": ("Release **" + $tag + "** has been successfully packaged and published!"),
                "fields": [
                  { "name": "🏷️ Version", "value": $tag, "inline": true },
                  { "name": "📦 Asset", "value": $asset, "inline": true },
                  { "name": "🚀 Released by", "value": $released_by, "inline": true },
                  { "name": "🔒 SHA256", "value": $checksum, "inline": true },
                  { "name": "🔗 Release Page", "value": $view_release, "inline": true }
                ],
                "footer": { "text": $footer },
                "timestamp": $timestamp
              }]
            }')

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"